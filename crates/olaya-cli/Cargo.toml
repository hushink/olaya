[package]
name = "olaya-cli"
description = "The olaya command-line interface and server binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "system-one", "decision-model", "inference"]
categories = ["command-line-utilities"]

[[bin]]
name = "olaya"
path = "src/main.rs"

[dependencies]
olaya = { version = "0.1.0", path = "../olaya" }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
indexmap.workspace = true

[features]
default = ["serve"]
serve = ["olaya/serve"]
qwen3guard = ["olaya/qwen3guard"]
decision = ["olaya/decision"]
kev = ["olaya/kev"]
clef = ["olaya/clef"]
cuda = ["olaya/cuda"]
metal = ["olaya/metal"]
