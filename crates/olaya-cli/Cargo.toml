[package]
name = "olaya-cli"
description = "The olaya command-line interface and server binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "system-one", "decision-model", "inference"]
categories = ["command-line-utilities"]

[[bin]]
name = "olaya"
path = "src/main.rs"
# Avoid a rustdoc output collision with the `olaya` library crate.
doc = false

[dependencies]
# The CLI always needs the hosted-catalog client; model families, the Hub, and
# the HTTP server remain selectable features.
olaya = { version = "0.1.8", path = "../olaya", default-features = false, features = ["remote"] }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
indexmap.workspace = true

[features]
default = [
    "serve",
    "hub",
    "laya",
    "nli",
    "gliclass",
    "von",
    "decima",
    "qwen3guard",
    "decision",
    "kev",
    "clef",
]
serve = ["olaya/serve"]
hub = ["olaya/hub"]
laya = ["olaya/laya"]
nli = ["olaya/nli"]
gliclass = ["olaya/gliclass"]
von = ["olaya/von"]
decima = ["olaya/decima"]
qwen3guard = ["olaya/qwen3guard"]
qwen35 = ["olaya/qwen35"]
decision = ["olaya/decision"]
kev = ["olaya/kev"]
clef = ["olaya/clef"]
all-families = ["olaya/all-families"]
cuda = ["olaya/cuda"]
metal = ["olaya/metal"]
