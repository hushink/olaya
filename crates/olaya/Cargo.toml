[package]
name = "olaya"
description = "A candle-based System One decision-model runtime: embeddable library and engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["system-one", "decision-model", "candle", "inference"]
categories = ["science", "api-bindings"]

[dependencies]
olaya-core = { version = "0.1.7", path = "../olaya-core" }
olaya-candle = { version = "0.1.7", path = "../olaya-candle" }
candle-core.workspace = true
candle-nn.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
sha2.workspace = true
hex.workspace = true
shaul = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[features]
default = [
    "laya",
    "nli",
    "gliclass",
    "von",
    "decima",
    "qwen3guard",
    "decision",
    "kev",
    "clef",
    "hub",
    "remote",
]
laya = ["olaya-candle/laya"]
nli = ["olaya-candle/nli"]
gliclass = ["olaya-candle/gliclass"]
von = ["olaya-candle/von"]
decima = ["olaya-candle/decima"]
qwen3guard = ["olaya-candle/qwen3guard"]
qwen35 = ["olaya-candle/qwen35"]
kev = ["olaya-candle/kev"]
decision = ["olaya-candle/decision"]
clef = ["olaya-candle/clef"]
all-families = [
    "laya",
    "nli",
    "gliclass",
    "von",
    "decima",
    "qwen3guard",
    "qwen35",
    "kev",
    "decision",
    "clef",
]
hub = ["dep:shaul", "dep:reqwest"]
remote = ["dep:reqwest"]
cuda = ["olaya-candle/cuda"]
metal = ["olaya-candle/metal"]
async = ["dep:tokio"]
serve = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "serve-auth",
    "serve-multipart",
    "serve-metrics",
]
serve-auth = []
serve-multipart = []
serve-metrics = []
