[package]
name = "olaya-sdk"
description = "A typed Rust client SDK for the TypeSafe/Jev System One API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["typesafe", "jev", "system-one", "sdk", "client"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[features]
default = []
# Synchronous client built on reqwest's blocking transport.
blocking = ["reqwest/blocking"]
# Gzip request-body compression for JSON requests of 1 KiB or more.
gzip = ["dep:flate2"]

[dependencies]
base64.workspace = true
flate2 = { workspace = true, optional = true }
httpdate.workspace = true
indexmap.workspace = true
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "rustls",
] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio.workspace = true

[package.metadata.docs.rs]
all-features = true
