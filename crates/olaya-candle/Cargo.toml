[package]
name = "olaya-candle"
description = "candle family SDK for olaya: encoders, tokenizers, built-in families, and the third-party family traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["candle", "system-one", "decision-model", "machine-learning"]
categories = ["science", "api-bindings"]

[dependencies]
olaya-core = { version = "0.1.0", path = "../olaya-core" }
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
indexmap.workspace = true
zip = { workspace = true, optional = true }

[features]
default = ["modernbert", "tokenizer"]
modernbert = ["dep:candle-transformers"]
deberta = ["dep:candle-transformers"]
bert = ["dep:candle-transformers"]
qwen3 = ["dep:candle-transformers"]
qwen35 = []
tokenizer = ["dep:tokenizers"]
torch = ["dep:zip"]
laya = ["modernbert", "tokenizer"]
nli = ["modernbert", "deberta", "tokenizer"]
gliclass = ["deberta", "tokenizer"]
von = ["modernbert", "tokenizer", "torch"]
decima = ["bert", "modernbert", "tokenizer"]
qwen3guard = ["qwen3", "tokenizer"]
decision = ["qwen35", "tokenizer"]
kev = ["qwen35", "tokenizer", "torch"]
clef = ["qwen35", "tokenizer"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
