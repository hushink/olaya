# Repository label taxonomy. This file is the source of truth; the labels
# workflow syncs it with GitHub. Existing GitHub defaults are renamed with
# from_name so issue/PR assignments are preserved.

# Types: exactly one per issue or PR.
- name: "type: bug"
  from_name: "bug"
  color: "#d73a4a"
  description: "Something is broken or behaves incorrectly"

- name: "type: feature"
  from_name: "enhancement"
  color: "#a2eeef"
  description: "New user-facing capability or behavior"

- name: "type: docs"
  from_name: "documentation"
  color: "#0075ca"
  description: "Documentation, examples, or comments only"

- name: "type: chore"
  color: "#cfd3d7"
  description: "Maintenance, refactoring, or tooling without behavior changes"

- name: "type: dependencies"
  color: "#0366d6"
  description: "Dependency or toolchain updates (Dependabot, manual bumps)"

- name: "type: release"
  color: "#1d76db"
  description: "Release PR, version bump, or publishing change"

- name: "type: question"
  from_name: "question"
  color: "#d876e3"
  description: "Usage question or request for clarification"

# Status: keep the triage workflow short.
- name: "status: needs triage"
  color: "#fbca04"
  description: "Awaiting initial maintainer review"

- name: "status: confirmed"
  color: "#0e8a16"
  description: "Reproduced or accepted for work"

- name: "status: blocked"
  color: "#b60205"
  description: "Cannot proceed until a dependency or decision is resolved"

- name: "status: waiting for author"
  color: "#d4c5f9"
  description: "Waiting for more information from the reporter"

# Priority: choose one; use GitHub Projects instead if it becomes the source.
- name: "priority: high"
  color: "#b60205"
  description: "Should be addressed in the current cycle"

- name: "priority: medium"
  color: "#d93f0b"
  description: "Important but not urgent"

- name: "priority: low"
  color: "#c2e0c6"
  description: "Nice to have; address when capacity allows"

# Areas: mirror the workspace components and release surface.
- name: "area: core"
  color: "#5319e7"
  description: "Protocol types, validation, manifests, and registry/store traits"

- name: "area: candle"
  color: "#5319e7"
  description: "Candle encoders, model families, and checkpoint loading"

- name: "area: serve"
  color: "#5319e7"
  description: "HTTP server, TypeSafe API, batching, and observability"

- name: "area: cli"
  color: "#5319e7"
  description: "The olaya command-line interface"

- name: "area: sdk"
  color: "#5319e7"
  description: "The independent olaya-sdk client"

- name: "area: registry"
  color: "#5319e7"
  description: "Registry manifests, catalog bundle, and remote catalog"

- name: "area: ci"
  color: "#5319e7"
  description: "CI, release automation, Dependabot, and repository tooling"

- name: "area: performance"
  color: "#5319e7"
  description: "Throughput, latency, memory, and device acceleration"

# Contributor labels: use the exact names GitHub surfaces on the contribute page.
- name: "good first issue"
  color: "#7057ff"
  description: "Good for first-time contributors"

- name: "help wanted"
  color: "#008672"
  description: "Extra attention or contributors welcome"
