name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["type: feature", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. For usage questions, read the README and crate docs before opening an issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, CLI flag, or manifest change you want.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of olaya would this affect?
      options:
        - olaya-core
        - olaya-candle / model families
        - Engine or HTTP server
        - olaya-cli
        - olaya-sdk
        - Registry or catalog
        - Release, CI, or tooling
        - Documentation
        - Other / not sure
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other tools, or designs you considered.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, examples, or references.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the documentation.
          required: true
        - label: I am willing to contribute a pull request.
          required: false
