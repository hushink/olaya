name: Documentation issue
description: Report incorrect, missing, or unclear documentation
title: "[Docs]: "
labels: ["type: docs", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for the README, crate docs, examples, or design notes.
        For usage questions, read the README and crate docs first.

  - type: input
    id: location
    attributes:
      label: Location
      description: URL, file path, or section name.
      placeholder: "README.md#quick-start or https://docs.rs/olaya/..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, missing, or unclear?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Wording, example, or link that would fix it.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the documentation.
          required: true
