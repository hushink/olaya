name: Bug report
description: Report a reproducible problem in olaya
title: "[Bug]: "
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        Do not paste API keys, tokens, private model data, or full customer content.
        Security vulnerabilities should be reported privately via the link on the new-issue page.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of olaya is affected?
      options:
        - olaya-cli
        - olaya-sdk
        - HTTP server (/v1 or /api)
        - Engine or model family
        - Registry or catalog
        - Build, CI, or tooling
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`olaya --version`, crate version, or commit. Include `rustc --version` when building from source."
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model or alias
      description: The model name used in the request, if applicable.
      placeholder: "laya-latest, nli-modernbert, gliclass-instruct-edge, ..."
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - CPU
        - CUDA
        - Metal
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: dtype
    attributes:
      label: Dtype
      description: The configured weight dtype, when applicable.
      options:
        - F32
        - F16
        - BF16
        - Not applicable / unknown
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact CLI command, HTTP request, SDK call, or library call.
      placeholder: |
        1. Run `olaya ...`, send `POST /v1/systemone`, or call `client.system_one(...)`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: state_questions
    attributes:
      label: Minimal state and questions
      description: Paste a minimal JSON state and questions object. Remove private content.
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Use `RUST_LOG=olaya=debug,olaya_candle=debug` (or `olaya_sdk=debug`); for panics also set `RUST_BACKTRACE=1`. Remove secrets and include the `x-typesafe-request-id` header for HTTP requests."
      render: shell
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Attachments
      description: Small logs, screenshots, or a minimal reproduction archive. Do not upload model weights.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.log,.txt,.json,.zip"

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, related issues, or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the documentation.
          required: true
        - label: I removed API keys, tokens, private data, and model weights from this report.
          required: true
        - label: This is not a security vulnerability; I will report those privately.
          required: true
