name: Configure trusted publishers

# One-off helper for the first crates.io setup. It creates a GitHub Trusted
# Publishing configuration for each published crate. CARGO_REGISTRY_TOKEN must
# have the `trusted-publishing` endpoint scope. Delete this workflow after the
# configs exist and CRATES_IO_TRUSTED_PUBLISHING is enabled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Create trusted publisher configs
        shell: bash
        run: |
          set -euo pipefail
          api="https://crates.io/api/v1/trusted_publishing/github_configs"
          crates=(olaya-core olaya-candle olaya olaya-cli olaya-sdk)

          for crate in "${crates[@]}"; do
            echo "::group::Configure $crate"

            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
              -H "Authorization: ${CRATES_IO_TOKEN}" \
              -H "User-Agent: olaya-trustpub-setup" \
              "${api}?crate=${crate}")
            echo "GET $crate -> HTTP $status"
            cat /tmp/response.json
            echo
            if [ "$status" != "200" ]; then
              echo "::error::The token needs the trusted-publishing scope and crate access"
              exit 1
            fi

            body=$(jq -n --arg crate "$crate" '{
              github_config: {
                krate: $crate,
                repository_owner: "hushink",
                repository_name: "olaya",
                workflow_filename: "release-plz.yml",
                environment: null
              }
            }')

            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
              -X POST "$api" \
              -H "Authorization: ${CRATES_IO_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: olaya-trustpub-setup" \
              --data "$body")
            echo "POST $crate -> HTTP $status"
            cat /tmp/response.json
            echo

            case "$status" in
              200)
                ;;
              409)
                echo "::warning::$crate already has a trusted publisher config"
                ;;
              *)
                echo "::error::Failed to configure $crate"
                exit 1
                ;;
            esac

            echo "::endgroup::"
          done
