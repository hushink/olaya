name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p olaya-sdk --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p olaya-sdk --all-features
      - run: cargo test -p olaya --features serve --test serve_contract
      - run: cargo run -p xtask -- sync-registry --output "$RUNNER_TEMP/registry-catalog.json"
      - run: jq -e '.schema_version == 1 and ((.manifests | length) > 0)' "$RUNNER_TEMP/registry-catalog.json" > /dev/null

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - "-p olaya --features all-families"
          - "-p olaya --features serve"
          - "-p olaya --no-default-features --features clef"
          - "-p olaya --no-default-features --features kev"
          - "-p olaya --no-default-features --features decision"
          - "-p olaya --no-default-features --features qwen3guard"
          - "-p olaya --no-default-features --features laya,nli,gliclass,von,decima"
          - "-p olaya-cli"
          - "-p olaya-sdk --all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.args }}

  metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p olaya --features metal

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
